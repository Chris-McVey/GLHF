# Editorial overrides for the NES canonical set (Wikipedia-primary).
#
# Membership comes from Wikipedia's licensed + unlicensed Western retail tables
# (see CANONICAL_POLICY.md). This file only patches enrichment: release year,
# RAWG ID, and future `[license]` / `[exclude]` on rows that are in the set.
#
# Keys are Wikidata QIDs when the row matched Wikidata; otherwise `wp:<normalized-title>`.
# Re-run: `uv run curate.py --platform nes`

# Force-include — unused in Wikipedia-primary mode (membership = Wikipedia rows).
[include]

# Force-drop — only needed for a QID/wp-key that appears in the Wikipedia set.
[exclude]

# Display name — Wikipedia title is already canonical; add only if we override away from WP.
[name]

# Pin release year when RAWG or Wikidata conflates regions (Wikipedia NA/PAL wins by default).
[year]
Q1920147 = 1990   # Super C NA (Konami); RAWG had JP arcade year
Q1946500 = 1991   # World Champ NA (Romstar)
Q6826906 = 1991   # MiG-29: Soviet Fighter NA (Camerica)
Q748636  = 1991   # Peek-A-Boo Poker NA (Panesian)
Q785278  = 1991   # Pac-Mania NA (Tengen); RAWG had arcade year

# RAWG ID when auto-match is wrong or indexes another region's title.
[rawg]
Q1920147 = 54074   # Super C
Q2045111 = 53422   # Micro Machines (Camerica NES; RAWG "Old" entry)
Q2045651 = 53924   # Tag Team Match: M.U.S.C.L.E.
Q3129137 = 262959  # Heavy Barrel -> Johnny Turbo's Arcade listing on RAWG
Q3280693 = 810002  # Cowboy Kid -> Western Kids on RAWG
Q610785  = 602231  # Dragon Power -> Dragon Ball: Shenron no Nazo on RAWG

[license]

