# Editorial overrides for the Nintendo Entertainment System canonical set.
#
# Walk `output/review/nes-review.md` to identify entries that need a manual
# decision. Each section below is optional; reasons (string values) are
# required so the next reviewer understands why.
#
# Re-run `uv run curate.py --platform nes` after edits — overrides are
# applied at every pipeline run and survive cache invalidation.
#
# See `nes.toml.example` for a worked example with real Dragon Warrior /
# Mike Tyson's Punch-Out cases pulled from the review report.

